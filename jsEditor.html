<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线JS编辑器 (Monaco + iframe)</title>
    <style>
        /* 基础布局样式 */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }
        #container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }
        #editor-container {
            flex: 1;
            height: 100%;
            border-right: 2px solid #ccc;
        }
        #output-container {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #f5f5f5;
        }
        #output-header {
            padding: 8px 15px;
            background: #e9e9e9;
            border-bottom: 1px solid #ccc;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        #run-btn {
            padding: 4px 16px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        #run-btn:hover {
            background: #45a049;
        }
        #output-frame {
            flex: 1;
            width: 100%;
            border: none;
            background: white;
        }
        /* 加载提示 */
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 20px 30px;
            border-radius: 8px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="loading">正在加载 Monaco Editor...</div>
    <div id="container">
        <div id="editor-container"></div>
        <div id="output-container">
            <div id="output-header">
                <span>▶ 运行结果</span>
                <button id="run-btn">▶ 运行代码 (Ctrl+Enter)</button>
            </div>
            <iframe id="output-frame"></iframe>
        </div>
    </div>

    <!-- 1. 使用你指定的 loader 加载 Monaco -->
    <script src="https://g.alicdn.com/code/lib/monaco-editor/0.52.0/min/vs/loader.min.js"></script>
    <script>
        // 配置 Monaco 的加载路径
        const monacoLoader = window.require;
        if (!monacoLoader) throw document.getElementById('loading').innerText = '错误：Monaco Loader 未能加载。';

        monacoLoader.config({
            paths: {
                vs: 'https://g.alicdn.com/code/lib/monaco-editor/0.52.0/min/vs'
            }
        });

        // 加载 Monaco 核心库
        monacoLoader(['vs/editor/editor.main'], function () {
            document.getElementById('loading').style.display = 'none';
            initEditor();
        });

        // --- 编辑器初始化 ---
        function initEditor() {
            const editorContainer = document.getElementById('editor-container');
            
            // 创建 Monaco 编辑器实例
            const editor = monaco.editor.create(document.getElementById('editor-container'), {
                value: `console.log("hello")`,
                language: 'javascript',
                theme: 'vs-dark',
                // automaticLayout: true,
                fontSize: 14,
            });

            // --- 获取 iframe 元素 ---
            const frame = document.getElementById('output-frame');

            // --- 核心运行函数 ---
            function runCode() {
                frame.onload = null;
                const code = editor.getValue();
                frame.srcdoc = '<!DOCTYPE html><html><head></head><body></body></html>';
                frame.onload = e => frame.contentWindow.eval(code);
            }

            document.getElementById('run-btn').addEventListener('click', runCode);

            // 快捷键：Ctrl+Enter 运行
            editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, runCode);

            // 默认自动运行一次，展示效果
            setTimeout(runCode, 300);
        }
    </script>
</body>
</html>
